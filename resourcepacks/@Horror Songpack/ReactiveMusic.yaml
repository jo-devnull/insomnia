name: "Horror Songpack"
version: "1.0"
author: "jo-devnull"
description: "Horror Theme Songpack"

credits: "Kevin MacLeod, Crow Shade, Alexander Nakarada, Tim Beek, Ross Bugden, Mehul ShaRma, VIVEK ABHISHEK, CO.AG Music, FesliyanStudios.com"

# How fast music will stop when it's event becomes invalid
# Available values: INSTANT, SHORT, NORMAL, LONG
musicSwitchSpeed: NORMAL

# How much silence there should be before a new song starts playing again
# Available values: NONE, SHORT, NORMAL, LONG
musicDelayLength: LONG

entries:
    # entries at the top get prioritized the highest!
    - events: ["MAIN_MENU"]
      # forceStop/forceStart will interrupt whatever's currently playing, only use this for special cases
      # if you want this to be the default behavior, change musicSwitchSpeed and musicDelayLength instead
      forceStopMusicOnChanged: true
      forceStartMusicOnValid: true
      songs:
          - "the_house"
          - "ghost"
          - "haunted"

    - events: ["DIM=OVERWORLD"]
      songs:
          - "the_house"
          - "ghost"
          - "curse"
          - "haunted"
          - "music_box"
          - "silent_hill"
          - "grass"
          - "dark_fog"
          - "tree"
          - "dark_rage"
          - "dead_and_buried"
          - "evil_rising"
          - "gathering_darkness"
          - "the_fly"
          - "the_dark_room"
          - "hor_hor"
          - "the_offering"
          - "psycho"
          - "shadowlands"
          - "shiver"
          - "the_village"
          - "calling_the_dead"
          - "welcome_to_horrorland"
